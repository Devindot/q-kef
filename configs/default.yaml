project:
  seed: 42

dataset:
  name: fiqa
  source: beir
  temporal_variant: qkef-fiqa-evolution
  raw_dir: data/raw/beir
  processed_dir: data/processed/qkef_fiqa_evolution
  chunk_processed_dir: data/processed/qkef_fiqa_chunks
  source_url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/fiqa.zip
  expected_md5: 17918ed23cd04fb15047f73e6c3bd9d9

evolution_benchmark:
  seed: 42
  generator_version: "1.0"
  action_definitions_version: "1.0"
  events_per_action: 50
  train_events_per_action: 30
  dev_events_per_action: 10
  test_events_per_action: 10
  t0_timestamp: "2025-01-01T00:00:00Z"
  t1_timestamp: "2026-01-01T00:00:00Z"
  actions:
    - NEW
    - REPLACE
    - MERGE
    - ARCHIVE
    - COEXIST
    - SPLIT

chunking:
  enabled_strategies:
    - identity
    - fixed_window
    - tfidf_boundary
  fixed_window:
    max_words: 160
    overlap_words: 30
  tfidf_boundary:
    min_words: 50
    target_words: 120
    max_words: 180
    boundary_similarity_threshold: 0.15

ingestion:
  version: "1.0"
  expected_t0_units: 200
  expected_t1_units: 300
  normalization_version: "1.0"
  sanitizer_version: "1.0"
  normalization:
    unicode_form: NFKC
    normalize_line_endings: true
    remove_zero_width: true
    trim_whitespace: true
    normalize_horizontal_whitespace: true
    max_blank_lines: 2
  sanitization:
    remove_merge_scaffold: true
    neutralize_split_boundary: true
    remove_archive_target_id_from_text: true
    max_unapproved_removal_fraction: 0.25

embedding:
  backend: sentence_transformers
  model_name: sentence-transformers/all-MiniLM-L6-v2
  normalize_embeddings: true
  batch_size: 32
  device: cpu
  cache_enabled: true
  cache_dir: data/processed/qkef_embeddings
  config_version: "1.0"

evolution:
  candidate_top_k: 5
  replace_threshold: null
  merge_threshold: null
  coexist_threshold: null

quantum_inspired:
  enabled: true
  basis_method: pca
  state_dimension_grid:
    - 8
    - 16
    - 32
  include:
    fidelity: true
    state_entropy: true
    coherence_like: true
    probability_distance: true

candidate_retrieval:
  top_k: 5

evolution_models:
  random_seed: 42
  selection_metric: macro_f1
  conventional:
    classifier: logistic_regression
    c_grid:
      - 0.1
      - 1.0
      - 10.0

retrieval:
  top_k: 5
  evaluation_k:
    - 1
    - 3
    - 5
  selected_strategy: tfidf_boundary
  hybrid_weights:
    semantic: 0.8
    lexical: 0.2
    graph: 0.0

phase3:
  output_dir: data/processed/qkef_phase3
  model_dir: models/phase3
  report_dir: reports/phase3
  version: "1.0"
